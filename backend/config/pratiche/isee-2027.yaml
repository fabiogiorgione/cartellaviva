# Modello di pratica: ISEE per la DSU del 2027 (redditi e patrimonio del 2025).
#
# PROVVISORIO: copia delle regole del 2026. Le istruzioni INPS per la DSU 2027
# vanno ricontrollate prima di gennaio 2027; allora scrivere la data in "verificato".
#
# L'app NON calcola l'indicatore: raccoglie i documenti per persona del
# nucleo, li controlla e prepara il pacchetto per il CAF o per controllare la
# DSU precompilata. Lo verifica ogni anno chi mantiene il progetto, sulle
# istruzioni INPS, prima di attivarlo: scrivere la data in "verificato".
# Formato: vedi docs/pratiche.md, "Il motore comune".
modello: isee
anno: 2027
riferimento: -2
titolo: 'ISEE 2027 · redditi e patrimonio 2025'
descrizione: 'I documenti per la DSU del 2027: redditi e patrimonio del 2025 di ogni persona del nucleo.'
verificato: ~
fonti:
    - titolo: 'INPS, Istruzioni per la compilazione della DSU'
      url: 'https://servizi2.inps.it/servizi/Iseeriforma/docs/info/Modulistica/Istruzioni%20alla%20compilazione%20anno%202021.pdf'
    - titolo: 'INPS, Portale unico ISEE'
      url: 'https://www.inps.it/it/it/dettaglio-scheda.it.schede-servizio-strumento.schede-servizi.Portale-unico-ISEE.html'
    - titolo: 'INPS, ISEE precompilato: acquisizione della DSU precompilata'
      url: 'https://servizi2.inps.it/servizi/iseeprecompilato/docs/info/Guide/ISEEPrecompilato_Tutorial_Parte3.pdf'
note: >-
    Redditi e patrimonio sono quelli del secondo anno prima della DSU; per ogni
    conto servono il saldo al 31 dicembre e la giacenza media annua. L'ISEE vale
    fino al 31 dicembre dell'anno in cui si presenta la DSU. Dal 1° aprile, con
    variazioni rilevanti, si può chiedere l'ISEE corrente.
rinnovo: { titolo: 'Rinnovare l''ISEE', giorni: 30 }

requisiti:
    nucleo:
        etichetta: 'Nucleo familiare'
        descrizione: 'Lo stato di famiglia (o un''autocertificazione) con chi fa parte del nucleo alla data della DSU.'
        per: famiglia
        somma: false
        data: libera
        ancheVecchi: true
        riconosci:
            parole: ['stato di famiglia', 'situazione di famiglia', 'certificato contestuale', 'famiglia anagrafica']
            senza: ['attestazione isee']
        tipi:
            stato_famiglia: { etichetta: 'Stato di famiglia' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Documento' }
            data: { tipo: data, etichetta: 'Data del certificato' }

    documento_identita:
        etichetta: 'Documento e codice fiscale'
        descrizione: 'Un documento d''identità valido e la tessera sanitaria (codice fiscale) di ogni persona del nucleo.'
        per: persona
        obbligatorio: true
        somma: false
        data: libera
        ancheVecchi: true
        riconosci:
            categorie: [documenti_identita]
            parole: ['carta d''identità', 'carta di identità', 'carta identità', 'identity card', 'passaporto', 'tessera sanitaria', 'tessera europea di assicurazione malattia', 'patente di guida']
            nomi: ['ci', 'cie', 'cf', 'codice fiscale']
            # Un curriculum cita la patente; un documento d'identità no.
            senza: ['attestazione isee', 'curriculum', 'esperienza lavorativa', 'esperienze lavorative', 'esperienze professionali', 'istruzione e formazione']
        tipi:
            carta_identita: { etichetta: 'Carta d''identità', parole: ['carta d''identità', 'carta di identità', 'carta identità', 'identity card'], nomi: ['ci', 'cie'] }
            passaporto: { etichetta: 'Passaporto', parole: ['passaporto'] }
            patente: { etichetta: 'Patente', parole: ['patente'] }
            tessera_sanitaria: { etichetta: 'Tessera sanitaria', parole: ['tessera sanitaria', 'tessera europea di assicurazione malattia'], nomi: ['cf', 'codice fiscale'] }
        campi:
            tipo: { tipo: scelta, etichetta: 'Documento' }
            data: { tipo: data, etichetta: 'Scadenza' }

    redditi:
        etichetta: 'Redditi'
        descrizione: 'CU, 730 o Redditi PF con i redditi dell''anno di riferimento.'
        per: persona
        obbligatorio: true
        somma: false
        data: dopo
        riconosci:
            parole: ['certificazione unica', 'certificazione di cui all''art. 4', 'certificazione lavoro dipendente', 'originale per il percipiente', 'modello 730', 'redditi persone fisiche', 'sostituto d''imposta', 'sostituto di imposta', 'prospetto di liquidazione']
            senza: ['attestazione isee']
        tipi:
            cu: { etichetta: 'Certificazione Unica', parole: ['certificazione unica', 'certificazione di cui all''art. 4', 'originale per il percipiente', 'certificazione lavoro dipendente'] }
            dichiarazione_730: { etichetta: 'Modello 730', parole: ['730', 'prospetto di liquidazione'] }
            redditi_pf: { etichetta: 'Redditi PF', parole: ['redditi persone fisiche'] }
        campi:
            tipo: { tipo: scelta, etichetta: 'Documento' }
            emittente: { tipo: testo, etichetta: 'Chi l''ha rilasciato' }
            importo: { tipo: importo, etichetta: 'Reddito complessivo', etichette: ['reddito complessivo'] }
            data: { tipo: data, etichetta: 'Data' }

    altri_redditi:
        etichetta: 'Assegni e altri trattamenti'
        descrizione: 'Assegni di mantenimento ricevuti o versati, borse di studio e altre somme dell''anno di riferimento.'
        per: persona
        riconosci:
            parole: ['assegno di mantenimento', 'assegno periodico', 'borsa di studio']
            senza: ['attestazione isee']
        tipi:
            mantenimento_ricevuto: { etichetta: 'Mantenimento ricevuto' }
            mantenimento_versato: { etichetta: 'Mantenimento versato' }
            borsa_studio: { etichetta: 'Borsa di studio', parole: ['borsa di studio'] }
            altro: { etichetta: 'Altro' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Tipo' }
            importo: { tipo: importo, etichetta: 'Importo dell''anno', obbligatorio: true }
            emittente: { tipo: testo, etichetta: 'Da chi' }
            data: { tipo: data, etichetta: 'Data' }
            descrizione: { tipo: testo, etichetta: 'Descrizione', libero: true }

    rapporti:
        etichetta: 'Conti e rapporti finanziari'
        descrizione: 'Per ogni conto, libretto, carta con IBAN o deposito titoli: saldo al 31 dicembre e giacenza media dell''anno, dalla comunicazione della banca.'
        per: persona
        data: libera
        scopri: iban
        riconosci:
            parole: ['estratto conto', 'giacenza media', 'saldo contabile', 'comunicazione annuale', 'documento di sintesi', 'libretto di risparmio', 'deposito titoli', 'consistenza media', 'dichiarazione isee']
            senza: ['attestazione isee', 'documento unico di rendicontazione']
        tipi:
            conto: { etichetta: 'Conto corrente', parole: ['conto corrente', 'c/c'] }
            libretto: { etichetta: 'Libretto di risparmio', parole: ['libretto'] }
            carta: { etichetta: 'Carta con IBAN', parole: ['carta prepagata', 'carta conto'] }
            deposito_titoli: { etichetta: 'Deposito titoli', parole: ['deposito titoli', 'dossier titoli'], nota: 'Titoli di Stato, buoni e libretti postali: indicali comunque. Le esclusioni previste dalla legge le applica il calcolo dell''INPS.' }
            altro: { etichetta: 'Altro rapporto' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Rapporto' }
            emittente: { tipo: testo, etichetta: 'Banca o intermediario' }
            iban: { tipo: iban, etichetta: 'IBAN' }
            importo: { tipo: importo, etichetta: 'Saldo al 31/12', obbligatorio: true, ultimo: true, etichette: ['saldo al 31', 'saldo contabile al 31', 'saldo finale', 'saldo contabile', 'saldo'] }
            giacenza: { tipo: importo, etichetta: 'Giacenza media annua', etichette: ['giacenza media', 'consistenza media'] }
            saldo_precompilata: { tipo: importo, etichetta: 'Saldo nella DSU precompilata', soloUtente: true, confronta: importo }
            giacenza_precompilata: { tipo: importo, etichetta: 'Giacenza nella DSU precompilata', soloUtente: true, confronta: giacenza }

    polizze:
        etichetta: 'Polizze vita e investimenti assicurativi'
        descrizione: 'Polizze vita a contenuto finanziario (ramo I, III, V): dal rendiconto annuale della compagnia, i premi versati o il valore al 31 dicembre.'
        per: persona
        data: libera
        riconosci:
            parole: ['documento unico di rendicontazione', 'investimento assicurativo', 'valore di riscatto', 'gestione separata', 'unit linked', 'polizza vita']
            senza: ['attestazione ai fini fiscali', 'dichiarazione dei redditi', 'attestazione isee']
        tipi:
            polizza_vita: { etichetta: 'Polizza vita', nota: 'Le polizze di sola protezione (caso morte, infortuni) senza valore di riscatto non rientrano nel patrimonio.' }
            altro: { etichetta: 'Altro investimento assicurativo' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Tipo' }
            emittente: { tipo: testo, etichetta: 'Compagnia' }
            importo: { tipo: importo, etichetta: 'Premi versati o valore al 31/12', obbligatorio: true, ultimo: true, etichette: ['valore del capitale al', 'valore netto in caso di riscatto', 'valore di riscatto', 'capitale maturato', 'prestazione maturata', 'controvalore', 'premi versati'] }
            data: { tipo: data, etichetta: 'Data del rendiconto' }

    immobili:
        etichetta: 'Casa e altri immobili'
        descrizione: 'Visure o valori ai fini IMU di case e terreni, e il mutuo che resta da pagare.'
        per: persona
        somma: false
        data: libera
        ancheVecchi: true
        riconosci:
            parole: ['visura catastale', 'visura attuale', 'visura storica', 'visura per soggetto', 'visura per immobile', 'servizi catastali', 'rendita catastale', 'valore ai fini imu', 'atto di compravendita', 'nota di trascrizione', 'catasto fabbricati', 'catasto terreni', 'debito residuo']
            senza: ['attestazione isee']
        tipi:
            abitazione_principale: { etichetta: 'Casa in cui si vive', parole: ['abitazione principale'] }
            altro_fabbricato: { etichetta: 'Altro fabbricato' }
            terreno: { etichetta: 'Terreno', parole: ['terreno'] }
        campi:
            tipo: { tipo: scelta, etichetta: 'Immobile' }
            descrizione: { tipo: testo, etichetta: 'Quale (indirizzo o dati catastali)', libero: true }
            importo: { tipo: importo, etichetta: 'Rendita o valore IMU', etichette: ['rendita', 'valore ai fini imu'] }
            mutuo_residuo: { tipo: importo, etichetta: 'Mutuo residuo al 31/12', etichette: ['debito residuo', 'capitale residuo'] }

    veicoli:
        etichetta: 'Veicoli'
        descrizione: 'Auto e moto intestate alle persone del nucleo, con la targa.'
        per: persona
        somma: false
        data: libera
        ancheVecchi: true
        scopri: targa
        riconosci:
            categorie: [veicoli]
            parole: ['carta di circolazione', 'libretto di circolazione', 'certificato di proprieta', 'tassa automobilistica', 'bollo auto']
            senza: ['attestazione isee']
        tipi:
            auto: { etichetta: 'Auto', parole: ['autovettura', 'auto'] }
            moto: { etichetta: 'Moto', parole: ['motociclo', 'moto'] }
            altro: { etichetta: 'Altro veicolo' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Veicolo' }
            targa: { tipo: targa, etichetta: 'Targa', obbligatorio: true }
            descrizione: { tipo: testo, etichetta: 'Modello', libero: true }

    affitto:
        etichetta: 'Casa in affitto'
        descrizione: 'Contratto di locazione registrato e canone annuo, se il nucleo vive in affitto.'
        per: famiglia
        somma: false
        data: libera
        ancheVecchi: true
        riconosci:
            parole: ['contratto di locazione', 'canone di locazione', 'canone annuo']
            senza: ['modello 730', 'attestazione isee']
        tipi:
            abitazione: { etichetta: 'Abitazione del nucleo' }
        campi:
            tipo: { tipo: scelta, etichetta: 'Tipo' }
            importo: { tipo: importo, etichetta: 'Canone annuo', etichette: ['canone annuo', 'canone'] }
            emittente: { tipo: testo, etichetta: 'Proprietario' }
            data: { tipo: data, etichetta: 'Data del contratto' }

    disabilita:
        etichetta: 'Disabilità e non autosufficienza'
        descrizione: 'Certificazioni di invalidità, legge 104 o non autosufficienza.'
        per: persona
        somma: false
        data: libera
        ancheVecchi: true
        riconosci:
            categorie: [salute]
            parole: ['invalidità civile', 'legge 104', 'non autosufficien', 'indennità di accompagnamento', 'handicap']
            # Le lettere delle assicurazioni citano invalidità e non autosufficienza: non sono certificazioni.
            senza: ['attestazione isee', 'polizza', 'premio', 'assicurazion']
        tipi:
            media: { etichetta: 'Disabilità media' }
            grave: { etichetta: 'Disabilità grave', parole: ['grave'] }
            non_autosufficienza: { etichetta: 'Non autosufficienza', parole: ['non autosufficien'] }
        campi:
            tipo: { tipo: scelta, etichetta: 'Condizione' }
            emittente: { tipo: testo, etichetta: 'Chi l''ha certificata' }
            data: { tipo: data, etichetta: 'Data del verbale' }
