name: cartellaviva
description: "CartellaViva: l'archivio digitale dei documenti di famiglia."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ## State
  get: ^4.6.6

  ## Storage
  shared_preferences: ^2.3.2
  # Token JWT/refresh fuori da SharedPreferences (Keychain / Keystore / WebCrypto)
  flutter_secure_storage: ^10.3.4

  ## HTTP (backend CartellaViva)
  dio: ^5.7.0

  ## URL
  url_strategy: ^0.3.0
  url_launcher: ^6.3.0


  ## Icon
  flutter_lucide: ^1.4.0

  ## Other
  file_picker: ^10.3.0
  # Versione vincolata da flutter_localizations (dipende dall'SDK)
  intl: any
  flutter_svg: ^2.0.10+1
  universal_html: ^2.2.4
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  google_sign_in_web: ^1.1.3
  cunning_document_scanner: ^3.0.3
  pdf: ^3.13.1
  image: ^4.10.1
  path_provider: ^2.1.6
  desktop_drop: ^0.8.4
  app_links: ^7.2.1
  open_filex: ^4.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/brand/
  # Caratteri inclusi nell'app (SIL Open Font License, testi in assets/fonts/):
  # nessun download da Google all'avvio.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800

